name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    name: ${{ matrix.os.name }} (${{ matrix.os.arch || 'x86_64' }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os.runner || 'ubuntu-26.04' }}
    container:
      image: ${{ matrix.os.image }}
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      NO_AT_BRIDGE: 1
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - clang
          - gcc
        os:
          - name: debian-stable
            image: mirror.gcr.io/library/debian:stable
          - name: debian-testing
            image: mirror.gcr.io/library/debian:testing
            coverage: gcc
            dist: gcc
            sanitize: clang
          - name: ubuntu-22.04-lts
            image: mirror.gcr.io/library/ubuntu:22.04
          - name: ubuntu-24.04-lts
            image: mirror.gcr.io/library/ubuntu:24.04
          - name: ubuntu-26.04-lts
            image: mirror.gcr.io/library/ubuntu:26.04
          - name: ubuntu-26.04-lts
            image: mirror.gcr.io/library/ubuntu:26.04
            arch: aarch64
            runner: ubuntu-26.04-arm
          - name: ubuntu-26.10
            image: mirror.gcr.io/library/ubuntu:26.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            git

      - uses: actions/checkout@v7

      - name: Install dependencies
        env:
          CC: ${{ matrix.compiler }}
        run: |
          opt_cc() { [[ $1 == "${CC}" ]] && echo "$2" || :; }
          opt_pkg() { apt-cache show "$1" >/dev/null 2>&1 && echo "$1" || :; }
          apt-get install -y \
            $(opt_cc clang "clang llvm") \
            $(opt_cc gcc gcc) \
            $(opt_pkg libblake3-dev) \
            appstream \
            curl \
            desktop-file-utils \
            gcovr \
            gettext \
            gnome-icon-theme \
            gnupg \
            gtk-update-icon-cache \
            libb2-dev \
            libcaja-extension-dev \
            libgcrypt20-dev \
            libgtk-3-dev \
            libmbedtls-dev \
            libnautilus-extension-dev \
            libnemo-extension-dev \
            librsvg2-common \
            libssl-dev \
            libthunarx-3-dev \
            libxml2-utils \
            libxxhash-dev \
            meson \
            nettle-dev \
            ninja-build \
            pkg-config \
            xvfb

      - name: meson setup
        env:
          CC: ${{ matrix.compiler }}
          COVERAGE_CC: ${{ matrix.os.coverage }}
          SANITIZE_CC: ${{ matrix.os.sanitize }}
        run: |
          opt_cc() { [[ $1 == "${CC}" ]] && echo "$2" || :; }
          has_pkg() { apt-cache show "$1" >/dev/null 2>&1 && echo true || echo false; }
          meson setup _build \
            $(opt_cc "${COVERAGE_CC}" "-Db_coverage=true") \
            $(opt_cc "${SANITIZE_CC}" "-Db_sanitize=address,undefined -Db_lundef=false") \
            -Dblake2=true \
            -Dblake3=$(has_pkg libblake3-dev) \
            -Dgcrypt=true \
            -Dlibcrypto=true \
            -Dmbedtls=true \
            -Dnettle=true \
            -Dxxhash=true \
            -Dzlib=true \
            -Dnative-file-chooser=true \
            -Dappstream=true \
            -Dbuild-gtkhash=true \
            -Dbuild-caja=true \
            -Dbuild-nautilus=$(has_pkg libnautilus-extension4) \
            -Dbuild-nemo=true \
            -Dbuild-thunar=true

      - name: meson compile
        run: meson compile -C _build

      - name: meson test
        run: |
          ninja -C _build tests/0.bytes tests/10M.bytes
          GTKHASH_TEST_BLKDEV_EMPTY=$(losetup --find --show _build/tests/0.bytes) \
          GTKHASH_TEST_BLKDEV_DATA=$(losetup --find --show _build/tests/10M.bytes) \
          xvfb-run -a -s "-screen 0 800x600x24" meson test -C _build --print-errorlogs

      - name: Print meson testlog.txt
        if: always()
        run: cat _build/meson-logs/testlog.txt || true

      - name: meson install
        run: meson install -C _build --destdir _install

      - name: Generate test coverage report
        if: matrix.os.coverage == matrix.compiler
        run: ninja -C _build coverage-xml

      - name: Upload test coverage report to Codecov
        if: matrix.os.coverage == matrix.compiler
        uses: codecov/codecov-action@v7
        with:
          files: _build/meson-logs/coverage.xml
          verbose: true

      - name: meson dist
        if: matrix.os.dist == matrix.compiler
        run: meson dist -C _build --no-tests

      - uses: actions/upload-artifact@v7
        if: matrix.os.dist == matrix.compiler
        with:
          name: gtkhash-${{ github.sha }}
          path: _build/meson-dist/*
          if-no-files-found: error
